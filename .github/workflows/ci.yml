name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tracker tests (Node built-in runner, no dependencies)
        run: node --test tests/tracker.test.js
      - name: Check shell files are valid
        run: |
          node --check data.js
          node --check state.js
          node --check app.js
          node --check service-worker.js
          python3 -m json.tool manifest.webmanifest > /dev/null
