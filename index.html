<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Space Marine Servo Skull Tracker checklist for collectible logs and items.">
    <meta name="theme-color" content="#121212">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <title>Servo Skull Tracker</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: #121212; 
            color: #e0e0e0; 
            max-width: 800px; 
            margin: 2rem auto; 
            padding: 0 1rem; 
        }
        h1 { 
            color: #ffb74d; 
            border-bottom: 1px solid #333; 
            padding-bottom: 0.5rem; 
        }
        .progress-container { 
            position: sticky; 
            top: 0; 
            background: #121212; 
            padding: 1rem 0; 
            border-bottom: 1px solid #333; 
            z-index: 10; 
        }
        .progress-top { 
            display: flex; 
            justify-content: space-between; 
            gap: 1rem; 
            flex-wrap: wrap; 
            align-items: center;
            margin-bottom: 0.5rem;
        }
        button {
            border: 1px solid #444;
            background: #1f1f1f;
            color: #e0e0e0;
            padding: 0.6rem 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover,
        button:focus-visible {
            background: #2b2b2b;
            outline: none;
        }
        progress { 
            width: 100%; 
            height: 24px; 
            accent-color: #ffb74d; 
            background-color: #333; 
            border: none; 
            border-radius: 4px; 
        }
        progress::-webkit-progress-bar { 
            background-color: #333; 
            border-radius: 4px; 
        }
        progress::-webkit-progress-value { 
            background-color: #ffb74d; 
            border-radius: 4px; 
        }
        details { 
            background: #1e1e1e; 
            margin-bottom: 0.5rem; 
            border-radius: 6px; 
            overflow: hidden; 
        }
        summary { 
            padding: 1rem; 
            font-weight: 600; 
            cursor: pointer; 
            background: #252525; 
            list-style: none; 
            display: flex; 
            justify-content: space-between; 
        }
        summary::-webkit-details-marker { display: none; }
        summary:hover { background: #2a2a2a; }
        .item { 
            padding: 0.75rem 1rem; 
            border-top: 1px solid #333; 
            display: flex; 
            align-items: flex-start; 
            gap: 0.75rem; 
        }
        .item:hover { background: #222; }
        input[type="checkbox"] { 
            margin-top: 0.25rem; 
            width: 18px; 
            height: 18px; 
            cursor: pointer; 
            accent-color: #ffb74d; 
        }
        label { 
            cursor: pointer; 
            flex: 1; 
            line-height: 1.4; 
        }
        .completed { 
            text-decoration: line-through; 
            color: #888; 
        }
        .item-location {
            font-size: 0.9em;
            color: #aaa;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>

    <h1>Space Marine: Servo Skull Tracker</h1>
    
    <div class="progress-container">
        <div class="progress-top">
            <strong>Global Progress</strong>
            <span id="global-count">0 / 0 Found</span>
            <button id="reset-button" type="button">Reset checklist</button>
        </div>
        <progress id="global-progress" value="0" max="0"></progress>
    </div>

    <div id="app"></div>

    <script>
        const data = [
            { chapter: "Chapter 2", items: [ { id: 1, audio_log: "Workshift Log 1/5", location: "Chapter Start - At the start, walk on until you see the first Gretchins, then go right behind the wall and blow up the Orky barricade to find the Skull behind it." }, { id: 2, audio_log: "Guardsman's Journal 1/5", location: "Chapter Start - Soon after meeting with Leandros and an ambush by Gretchins, the Skull should be near some sandbags, in front of you." }, { id: 3, audio_log: "Medicae Log 1/5", location: "Trenches - After you meet Mira and exit to the trenches, look inside the second bunker to find the Skull." }, { id: 4, audio_log: "Lt. Mira's Log 1/5", location: "No Man's Land - After you enter the destroyed building after the trench area, look for the Skull in a small room to the left, with a grenade crate in the doorway." }, { id: 5, audio_log: "Guardsman's Journal 2/5", location: "No Man's Land - After exiting said house, the next Skull is in the first bunker on the left." } ] },
            { chapter: "Chapter 3", items: [ { id: 6, audio_log: "Duty Log 1/5", location: "Chapter Start - Once you enter the fortress, there is a barricade to the right that you can destroy to reach a room with the Skull inside. When you see the chain pulling up the shells there is a hole in the wall on the right, use the makeshift ramp to climb in and the skull is in there." }, { id: 7, audio_log: "Lt. Mira's Log 2/5", location: "Armory - After riding the elevator down, the Skull is ahead of you by some ammo." } ] },
            { chapter: "Chapter 4 - Titans of Graia", items: [ { id: 8, audio_log: "Medicae Log 2/5", location: "Train Station - A little before boarding the train looted by Orks, you cross a barricaded walkway with some Orks and Bomb Squigs. At the end of the first walkway, turn left and check the niches." } ] },
            { chapter: "Chapter 5 - The Inquisitor", items: [ { id: 9, audio_log: "Guardsman's Journal 3/5", location: "Chapter Start - After you see the huge crane and fight Orks in the lower area, go up to the ramp but dont ascend it, check behind it is behind the boxes on the right." }, { id: 10, audio_log: "Encrypted Report: Inquisitor Drogan 1/5", location: "Cargo Bay - After taking the elevator down, it is in the middle of a long hallway next to some crates and Guardsmen." } ] },
            { chapter: "Chapter 6 - Lair of Giants", items: [ { id: 11, audio_log: "Workshift Log 2/5", location: "Chapter Start - Just after you take the lift up, on a side platform to the left of the main walkway with a view of the Titan." }, { id: 12, audio_log: "Inquisitor Report 2/5", location: "Chapter Start - In a large room with conveyor belts and orks coming out of pipes (first encounter with orks in this chapter), on a dead end walkway to the left of the exit out of the room." } ] },
            { chapter: "Chapter 7 - Heart of Darkness", items: [ { id: 13, audio_log: "Duty Log 2/5", location: "Chapter Start - In the second long, narrow room with pillars down the middle and pipes and walkways along the walls. Go into the door right next to the exist out of the room, that the orks came out of." }, { id: 14, audio_log: "Medicae Log 3/5", location: "Chapter Start - Just after you find the Melta Gun. Jump down onto the walkway, turn left, and break through an ork barricade." } ] },
            { chapter: "Chapter 8 - Whispers of the Dead", items: [ { id: 15, audio_log: "Medicae Log 4/5", location: "Chapter Start - Just after the start of the chapter, under the ledge you have to jump down from." }, { id: 16, audio_log: "Inquisitor Report 3/5", location: "Chapter Start - After you get the Lascannon, in a small room off to the right side of the narrow corridor." }, { id: 17, audio_log: "Workshift Log 3/5", location: "Chapter Start - Immediately after the previous one. Up the stairs, room on the left." }, { id: 18, audio_log: "Personal Message 1/5", location: "Street Warfare - After a Rok lands nearby, in a dead end on the right side of the underground tunnel." }, { id: 19, audio_log: "Inquisitor Report 4/5", location: "Street Warfare - On the upper level of a large room, to the left of the ramp leading to the surface." }, { id: 20, audio_log: "Personal Message 2/5", location: "Jump Pack - After you obtain the Jump Pack, jump onto the wall, then onto the second level through a large hole in the wall right in front of you." }, { id: 21, audio_log: "Inquisitor Report 5/5", location: "Immediately after the previous one. As you make you way out of the large room and past the landed Ork Rok, the skull is to the right of the staircase." }, { id: 22, audio_log: "Workshift Log 4/5", location: "In a dead end accessible from the upper level of the large circular room where you fight the first Weirdboy, to the right of the exit out of the room." }, { id: 23, audio_log: "Drogan's Journal 1/10", location: "Soon after the previous one. Instead of going right towards the objective indicator, continue straight on into a large dead end." }, { id: 24, audio_log: "Workshift Log 5/5", location: "From the stairs before skull number 23, head through the hole in the wall towards the objective indicator, then turn right and begin jumping up. As you go, keep a look out for a hole in the left-side wall, very high up. You'll be able to see the back of a large statue from outside this hole. Through the hole is a chapel. The skull is in front of the statue." } ] },
            { chapter: "Chapter 9 - The Weapon", items: [ { id: 25, audio_log: "Personal Message 3/5", location: "Kalkys Outskirts - Early from the checkpoint, left from the bridge destroyed by an Ork rok." }, { id: 26, audio_log: "Medicae Log 5/5", location: "Kalkys Outskirts - Next to a crashed Valkyrie where the canyons converge. Hard to miss." }, { id: 27, audio_log: "Lt. Mira's Log 3/5", location: "Kalkys Outskirts - Left of the ramp (after the second pipe) just before heading up the ramp and leaving the canal." } ] },
            { chapter: "Chapter 10 - House of Secrets", items: [ { id: 28, audio_log: "Duty Log 3/5", location: "Chapter Start - You can see this on the right behind a doorway from the big room with multiple turrets. After leaving the room, destroy two turrets in the corridor and turn right to reach it." }, { id: 29, audio_log: "Duty Log 4/5", location: "The Labs - In one of the smaller lab rooms with a single turret inside." }, { id: 30, audio_log: "Drogan's Journal 2/10", location: "Security Room - At the generator room, wait before inserting the Power Source and look to the right near a burning doorway where Orks came from." } ] },
            { chapter: "Chapter 12 - Dying of the Light", items: [ { id: 31, audio_log: "Personal Message 4/5", location: "Chapter Start - At the beginning, drop down into the pipe, move on until small stairs and intersection. Skull is on the left, behind a destructible Ork barricade." }, { id: 32, audio_log: "Drogan's Journal 3/10", location: "Chapter Start - Next room from the previous Skull, on the other side of the Iron Halo and weapon crates (left from exit)." }, { id: 33, audio_log: "Lt. Mira's Log 4/5", location: "Chapter Start - After exiting the next area (Orks fighting Chaos) via the ramp, go up the stairs and find the Skull in a small room upstairs." }, { id: 34, audio_log: "Guardsman's Journal 4/5", location: "Enemies Aplenty - After the elevator down and meeting Mira, you fight through a large room with Orks. The Skull is on the other side, by the back wall." }, { id: 35, audio_log: "Drogan's Journal 4/10", location: "Enemies Aplenty - Another Ork battle in a large space crossed by a catwalk, then an elevator up and into a hallway. When Mira is contacted over vox, you should see the Skull in a small room on the right." }, { id: 36, audio_log: "Duty Log 5/5", location: "Bastion Primus - From the previous location, carry on until you find the Plasma Gun and other gear. The Skull is in a corner. Impossible to miss." }, { id: 37, audio_log: "Guardsman's Journal 5/5", location: "Bastion Primus - After defending the outpost and leaving your squad, you drop down into a trench on your right. The Skull is next to the weapon crates." }, { id: 38, audio_log: "Lt. Mira's Log 5/5", location: "Showdown - After activating the sentry guns you go through a small doorway and down into a bunker. In the room with tons of weapon crates, look behind the containers. This is right at the checkpoint Showdown." } ] },
            { chapter: "Chapter 13", items: [ { id: 39, audio_log: "Drogan's Journal 5/10", location: "Chapter Start - At the beginning, when you enter the catwalk area with the first enemies, look into a doorway on the left right after entering the area." }, { id: 40, audio_log: "Drogan's Journal 6/10", location: "Free the Titan - After riding the big elevator down, it's right in front of you when you exit the elevator." }, { id: 41, audio_log: "Drogan's Journal 7/10", location: "Free the Titan - Right after you fight the Raptor champion and split from your squad, go up the ramp on the left of the elevator (center) door and check the small room." }, { id: 42, audio_log: "Possession 1/3", location: "Free the Titan - Where you meet the first Chaos Drone on the catwalks, check the middle doorway (left side when facing the exit) before leaving the area." } ] },
            { chapter: "Chapter 15 - Prince of Daemons", items: [ { id: 43, audio_log: "Drogan's Journal 8/10", location: "Chapter Start - Right at the beginning; ride the elevator down and it's right in front of you." }, { id: 44, audio_log: "Personal Message 5/5", location: "Traitor's Arena - After fighting Traitor Marines with Lascannons and a Daemon Maul guy in the round area with the collapsed roof. You will go up and down some ramps, kill a few Chaos cultists, and step down into an area where the roof is still intact. On your right side as you step down that little dirt ramp, behind a slumping panel of metal wreckage, is a broken Marine-sized pipe lying on its side. The servo skull is inside the pipe." }, { id: 45, audio_log: "Possession 2/3", location: "Traitor's Arena - After exiting the next area (several waves of Bloodletters), the Skull is right in front of you in the hallway, behind some weapon crates at the foot of the little stairs." } ] },
            { chapter: "Chapter 16", items: [ { id: 46, audio_log: "Drogan's Journal 9/10", location: "Ascent - During the Jump Pack phase, after the first Tainted Psyker battle you can see the Skull in the hallway on the left right after exiting the area." }, { id: 47, audio_log: "Drogan's Journal 10/10", location: "Vertigo - In the next area, there is a slightly elevated floating platform with a Plasma Cannon guy directly ahead. The Skull can be found here." }, { id: 48, audio_log: "Possession 3/3", location: "Vertigo - After the Jump Pack phase, when you see the first Chaos Drone, check the room to your right." } ] }
        ];

        const storageKey = 'servoSkullTrackerState';
        let savedState = {};

        const app = document.getElementById('app');
        const globalProgress = document.getElementById('global-progress');
        const globalCount = document.getElementById('global-count');
        const resetButton = document.getElementById('reset-button');

        const totalItems = data.reduce((sum, chapter) => sum + chapter.items.length, 0);

        function loadState() {
            try {
                const raw = localStorage.getItem(storageKey);
                savedState = raw ? JSON.parse(raw) : {};
            } catch (error) {
                savedState = {};
            }
        }

        function saveState() {
            localStorage.setItem(storageKey, JSON.stringify(savedState));
        }

        function updateGlobalCount(value) {
            globalCount.textContent = `${value} / ${totalItems} Found`;
            globalProgress.value = value;
        }

        function createChapter(chapterData, chapterIndex) {
            const details = document.createElement('details');
            const summary = document.createElement('summary');
            const titleSpan = document.createElement('span');
            titleSpan.textContent = chapterData.chapter;

            const countSpan = document.createElement('span');
            countSpan.id = `chap-count-${chapterIndex}`;
            countSpan.textContent = `0 / ${chapterData.items.length}`;

            summary.appendChild(titleSpan);
            summary.appendChild(countSpan);
            details.appendChild(summary);

            let chapterFound = 0;

            chapterData.items.forEach((itemData, itemIndex) => {
                const div = document.createElement('div');
                div.className = 'item';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `ch${chapterIndex}-item${itemIndex}`;
                checkbox.checked = !!savedState[checkbox.id];

                const label = document.createElement('label');
                label.htmlFor = checkbox.id;

                const itemTitle = document.createElement('div');
                itemTitle.innerHTML = `<strong>#${itemData.id} - ${itemData.audio_log}</strong>`;
                const itemLocation = document.createElement('div');
                itemLocation.textContent = itemData.location;
                itemLocation.className = 'item-location';

                label.appendChild(itemTitle);
                label.appendChild(itemLocation);

                if (checkbox.checked) {
                    chapterFound += 1;
                    label.classList.add('completed');
                }

                checkbox.addEventListener('change', (e) => {
                    if (e.target.checked) {
                        chapterFound += 1;
                        totalFound += 1;
                        label.classList.add('completed');
                        savedState[checkbox.id] = true;
                    } else {
                        chapterFound -= 1;
                        totalFound -= 1;
                        label.classList.remove('completed');
                        delete savedState[checkbox.id];
                    }
                    countSpan.textContent = `${chapterFound} / ${chapterData.items.length}`;
                    updateGlobalCount(totalFound);
                    saveState();
                });

                div.appendChild(checkbox);
                div.appendChild(label);
                details.appendChild(div);
            });

            countSpan.textContent = `${chapterFound} / ${chapterData.items.length}`;
            return { details, chapterFound };
        }

        loadState();

        let totalFound = Object.keys(savedState).length;

        data.forEach((chapterData, chapterIndex) => {
            const chapter = createChapter(chapterData, chapterIndex);
            app.appendChild(chapter.details);
        });

        globalProgress.max = totalItems;
        updateGlobalCount(totalFound);

        resetButton.addEventListener('click', () => {
            if (!confirm('Clear saved progress and reset all checklist items?')) {
                return;
            }
            savedState = {};
            localStorage.removeItem(storageKey);
            totalFound = 0;
            document.querySelectorAll('#app input[type="checkbox"]').forEach((checkbox) => {
                checkbox.checked = false;
                const label = document.querySelector(`label[for="${checkbox.id}"]`);
                if (label) {
                    label.classList.remove('completed');
                }
            });
            document.querySelectorAll('[id^="chap-count-"]').forEach((span) => {
                const chapterIndex = Number(span.id.replace('chap-count-', ''));
                span.textContent = `0 / ${data[chapterIndex].items.length}`;
            });
            updateGlobalCount(totalFound);
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then((registration) => {
                        console.log('Service worker registered:', registration.scope);
                    })
                    .catch((error) => {
                        console.warn('Service worker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
